<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trina Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            min-height: 100%;
            font-family: 'Geist Pixel', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Brand */
        .brand {
            display: flex;
            align-items: center;
            gap: 0;
            margin-top: 96px;
            margin-bottom: 120px;
        }

        .brand img.gem {
            height: 90px;
            width: auto;
            display: block;
            image-rendering: pixelated;
            margin-right: -112px;
            margin-top: -48px;
        }

        .brand .name {
            font-size: 48px;
            line-height: 1;
            white-space: nowrap;
        }

        /* Games */
        .games {
            width: 100%;
            max-width: 640px;
            padding: 0 24px 120px;
        }

        .games-label {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 40px;
        }

        .game-title {
            font-size: 28px;
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .game-desc {
            font-size: 15px;
            line-height: 1.7;
            color: #b0b0b0;
            margin-bottom: 28px;
        }

        .game-video {
            width: 100%;
            display: block;
            border-radius: 6px;
            margin-bottom: 28px;
            background: #0a0a0a;
        }

        .game-meta {
            font-size: 13px;
            line-height: 2;
            color: #888;
        }

        .game-meta .k {
            display: inline-block;
            width: 110px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .game-meta a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #444;
        }

        .game-meta a:hover {
            border-bottom-color: #fff;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            display: flex;
            gap: 28px;
            padding: 48px 24px;
        }

        .footer a {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            text-decoration: none;
        }

        .footer a:hover {
            color: #fff;
        }

        @media (max-width: 600px) {
            .brand { margin-top: 64px; margin-bottom: 80px; }
            .brand img.gem { height: 60px; margin-right: -75px; margin-top: -32px; }
            .brand .name { font-size: 32px; }
            .games { padding-bottom: 80px; }
            .game-title { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="brand">
        <img class="gem" src="Pati-idle.gif" alt="Trina Interactive">
        <span class="name">Trina Interactive</span>
    </div>

    <section class="games">
        <div class="games-label">Games</div>

        <article class="game">
            <h2 class="game-title">Slots &amp; Skulls</h2>
            <p class="game-desc">Spin, fight, upgrade your inventory with what you earn. A turn based roguelike where the forge giveth and the forge taketh.</p>

            <video class="game-video" autoplay muted loop playsinline preload="metadata">
                <source src="slots-and-skulls.mp4" type="video/mp4">
            </video>

            <div class="game-meta">
                <div><span class="k">Platforms</span> <a href="https://store.steampowered.com/app/4428910/Slots__Skulls/" target="_blank" rel="noopener">Steam</a></div>
                <div><span class="k">Press Kit</span> <a href="https://drive.google.com/drive/folders/1GrIPkeUNpGxxJZ_NxcIazyq4cZ637Iu0?usp=sharing" target="_blank" rel="noopener">Press Kit</a></div>
            </div>
        </article>
    </section>

    <footer class="footer">
        <a href="https://x.com/slotsandskulls" target="_blank" rel="noopener">Twitter</a>
        <a href="mailto:hi@trinainteractive.com">Email</a>
    </footer>
</body>
</html>
